# Serves the static build. Writable paths are under /tmp only, so the
# container runs with a read-only root filesystem.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # Optional /api proxy to the gateway, written at startup when GATEWAY_URL is set
    include /tmp/nginx/*.conf;

    # Runtime configuration, generated at startup from the environment
    location = /config.js {
        alias /tmp/config.js;
        add_header Cache-Control "no-store";
    }

    # Hashed file names: safe to cache forever
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: every other path is a client-side route
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
